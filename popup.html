<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NevUp Trading Coach</title>

  <link rel="stylesheet" href="styles/extension.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />
</head>

<body>

  <!-- Header -->
  <header class="app-header">
    <div class="header-left">
      <div class="coin-icon">
        <i class="fa-solid fa-chart-line"></i>
      </div>
      <div class="header-text">
        <h1>NevUp AI</h1>
        <span>Trading Journal</span>
      </div>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <nav class="tabs">
    <button class="tab-btn active" data-tab="journal">Journal</button>
    <button class="tab-btn" data-tab="alerts">Alerts</button>
  </nav>

  <!-- Main Content Area -->
  <main class="content-area">

    <!-- Trading Journal -->
    <div id="journal" class="view active"></div>

    <!-- Alerts -->
    <div id="alerts" class="view hidden">
      <p class="empty">No alerts yet</p>
    </div>

  </main>

  <!-- Footer -->
  <footer class="chat-footer">
    <div class="input-wrapper">
      <input type="text" placeholder="Ask Nev (coming soon)" disabled />
      <button class="send-btn" disabled>
        <i class="fa-regular fa-paper-plane"></i>
      </button>
    </div>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
