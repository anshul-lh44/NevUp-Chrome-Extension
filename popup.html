<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NevUp Trading Coach</title>

  <link rel="stylesheet" href="styles/extension.css" />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
  />
</head>

<body>

  <!-- Header -->
  <header class="app-header">
    <div class="header-left">
      <div class="coin-icon">
        <i class="fa-solid fa-chart-line"></i>
      </div>
      <div class="header-text">
        <h1>NevUp AI</h1>
        <span>Trading Journal</span>
      </div>
    </div>
  </header>

  <!-- Navigation Tabs -->
  <nav class="tabs">
    <button class="tab-btn active" data-tab="journal">Journal</button>
    <button class="tab-btn" data-tab="alerts">Alerts</button>
    <button class="tab-btn" data-tab="chat">Chat</button>
    <button class="tab-btn" data-tab="login">Login</button>
  </nav>

  <!-- Main Content Area -->
  <main class="content-area">

    <!-- Trading Journal -->
    <div id="journal" class="view active"></div>

    <!-- Alerts -->
    <div id="alerts" class="view hidden">
      <p class="empty">No alerts yet</p>
    </div>

    <!-- Login -->
    <div id="login" class="view hidden">
      <div id="login-container"></div>
      <div style="padding: 16px; border-top: 1px solid #2c313a; margin-top: 16px;">
        <button id="check-ws-status" style="width: 100%; padding: 8px; background-color: var(--card-bg); color: var(--text-primary); border: 1px solid #2c313a; border-radius: 8px; cursor: pointer; font-size: 12px; margin-bottom: 8px;">
          Check WebSocket Status
        </button>
        <button id="reconnect-ws" style="width: 100%; padding: 8px; background-color: var(--accent-blue); color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 12px;">
          Reconnect WebSocket
        </button>
        <div id="ws-status-display" style="margin-top: 12px; font-size: 11px; color: var(--text-secondary); line-height: 1.6;"></div>
      </div>
    </div>

    <!-- Chat -->
    <div id="chat" class="view hidden">
      <div id="chat-messages" class="chat-messages">
        <div class="chat-message ai">
          <div class="message-content">Hi! I'm Nev, your AI trading coach. Ask me anything about trading psychology, risk management, or your recent trades!</div>
        </div>
      </div>
    </div>

  </main>

  <!-- Footer -->
  <footer class="chat-footer">
    <div class="input-wrapper">
      <input type="text" id="chat-input" placeholder="Ask Nev anything..." />
      <button class="send-btn" id="send-btn">
        <i class="fa-regular fa-paper-plane"></i>
      </button>
    </div>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
